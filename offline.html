<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MindSpace — You're Offline</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1900ff;--blue-dark:#1200b3;--off:#F5F3EF;--ink:#0A0A0A;--muted:#888;--border:#E0DDD8}
html,body{height:100%;background:var(--off);color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px;text-align:center}

.logo{font-family:'Anton',sans-serif;font-size:28px;letter-spacing:3px;text-transform:uppercase;color:var(--ink);margin-bottom:48px;display:flex;align-items:center;gap:10px;justify-content:center}
.logo-pip{width:8px;height:8px;background:var(--blue)}

.icon-wrap{width:80px;height:80px;background:rgba(25,0,255,.08);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 28px}

.heading{font-family:'Anton',sans-serif;font-size:clamp(36px,8vw,64px);letter-spacing:2px;text-transform:uppercase;line-height:.9;color:var(--ink);margin-bottom:16px}
.heading em{color:var(--blue);font-style:normal;display:block}

.sub{font-size:15px;font-weight:300;color:var(--muted);line-height:1.8;max-width:360px;margin:0 auto 36px}

.retry-btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:var(--blue);color:#fff;border:none;padding:16px 40px;cursor:pointer;transition:background .2s;display:inline-block;text-decoration:none;margin-bottom:12px}
.retry-btn:hover{background:var(--blue-dark)}

.home-btn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;display:block;transition:color .2s}
.home-btn:hover{color:var(--ink)}

.divider{width:40px;height:1px;background:var(--border);margin:40px auto}

.crisis{background:#fff;border:1px solid var(--border);border-left:3px solid var(--blue);padding:20px 24px;max-width:360px;text-align:left}
.crisis-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.crisis-text{font-size:13px;font-weight:300;color:var(--muted);line-height:1.7}
.crisis-text strong{color:var(--ink);font-weight:600}

.ticker{position:fixed;bottom:0;left:0;right:0;height:28px;overflow:hidden;background:rgba(25,0,255,0.92);display:flex;align-items:center;border-top:1px solid rgba(255,255,255,.12)}
.ticker-track{display:flex;align-items:center;white-space:nowrap;animation:scroll 22s linear infinite}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-track span{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#fff;padding:0 28px;opacity:.9}
.ticker-track span.dot{color:rgba(255,255,255,.35);padding:0 4px;font-size:7px;letter-spacing:0}
</style>
</head>
<body>

<div class="logo"><span class="logo-pip"></span>MindSpace</div>

<div class="icon-wrap">📡</div>

<h1 class="heading">YOU'RE<br><em>OFFLINE</em></h1>
<p class="sub">It looks like your internet connection is unavailable. Please check your connection and try again — we'll be here when you're back.</p>

<button class="retry-btn" onclick="window.location.reload()">Try Again</button>
<a href="index.html" class="home-btn">← Back to Home</a>

<div class="divider"></div>

<div class="crisis">
  <div class="crisis-label">🆘 In Crisis?</div>
  <p class="crisis-text">Even without internet, help is available.<br><strong>Nigeria Suicide Prevention:</strong> <a href="tel:08008002000" style="color:var(--blue)">0800-800-2000</a><br><strong>Emergency Services:</strong> <a href="tel:112" style="color:var(--blue)">112</a></p>
</div>

<div class="ticker">
  <div class="ticker-track" id="tt"></div>
</div>
<style>body{padding-bottom:28px}</style>
<script>
(function(){
  var t=document.getElementById('tt');
  var seg='<span>#RiseWithIMPACT</span><span class="dot">&#10022;</span>';
  var h='';for(var i=0;i<24;i++)h+=seg;
  t.innerHTML=h+h;
})();
// Auto-retry when connection is restored
window.addEventListener('online', () => window.location.reload());
</script>
</body>
</html>
